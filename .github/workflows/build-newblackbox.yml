name: Build NewBlackbox AAR

on:
  workflow_dispatch:

jobs:
  build-bcore:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install SDK and NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;29.0.13846066"

    - name: Build Bcore AAR
      working-directory: NewBlackbox
      run: |
        chmod +x gradlew || true
        ./gradlew :Bcore:assembleRelease --no-daemon

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: newblackbox-bcore-aar
        path: NewBlackbox/Bcore/build/outputs/aar/*.aar
        retention-days: 30
