name: Build NewBlackbox AAR

on:
  workflow_dispatch:  # Manual trigger
  push:
    paths:
      - 'NewBlackbox/**'
      - '.github/workflows/build-newblackbox.yml'

jobs:
  build-bcore:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install SDK and NDK
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;29.0.13846066"

    - name: Build Bcore AAR
      working-directory: NewBlackbox
      run: |
        chmod +x gradlew
        ./gradlew :Bcore:assembleRelease --no-daemon

    - name: Copy AAR to project
      run: |
        mkdir -p blackbox/libs
        cp NewBlackbox/Bcore/build/outputs/aar/Bcore-release.aar blackbox/libs/NewBlackbox-Bcore.aar 2>/dev/null || \
        cp NewBlackbox/Bcore/build/outputs/aar/*.aar blackbox/libs/NewBlackbox-Bcore.aar 2>/dev/null || \
        echo "AAR not found, checking build outputs..."
        find NewBlackbox/Bcore/build/outputs -name "*.aar" 2>/dev/null

    - name: Upload AAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: newblackbox-bcore-aar
        path: blackbox/libs/*.aar
        retention-days: 30

    - name: Commit AAR to repo (optional)
      run: |
        if [ -f blackbox/libs/NewBlackbox-Bcore.aar ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blackbox/libs/NewBlackbox-Bcore.aar
          git diff --cached --quiet || git commit -m "build: add NewBlackbox Bcore AAR [skip ci]"
          git push
        fi
