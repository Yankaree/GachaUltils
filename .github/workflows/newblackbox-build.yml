name: Build NewBlackbox

on:
  push:
    branches: [ main ]
    paths:
      - 'NewBlackbox/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'NewBlackbox/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Accept SDK licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Install SDK packages
      run: |
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;29.0.13846066"

    - name: Grant execute permission for gradlew
      run: chmod +x NewBlackbox/gradlew

    - name: Build Bcore debug AAR
      working-directory: NewBlackbox
      run: ./gradlew :Bcore:assembleDebug --no-daemon

    - name: Build Bcore release AAR
      working-directory: NewBlackbox
      run: ./gradlew :Bcore:assembleRelease --no-daemon

    - name: Upload Bcore AARs
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: bcore-aars
        path: |
          NewBlackbox/Bcore/build/outputs/aar/*.aar

    - name: Upload build reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: newblackbox-reports
        path: NewBlackbox/Bcore/build/reports/
